<h2>Dashboard</h2>

<div class="stats">

    <div class="label">Livros cadastrados</div>
    <div class="value">{{ biblioteca.livros().length }}</div>
  </div>
  <div class="stat">
    <div class="label">Exemplares disponíveis</div>
    <div class="value">{{ biblioteca.exemplaresDisponiveis().length }}</div>
