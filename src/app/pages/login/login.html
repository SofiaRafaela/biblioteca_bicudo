<main class="site">

    <section class="brand-panel">
        <div class="brand-content">

            <div class="logo">
                <img src="/bibi.jpg" alt="Logo Biblioteca Educacional Bicudo">
            </div>

            <p class="mini-title">BIBLIOTECA</p>

            <h1>
                EDUCACIONAL
                <strong>BICUDO</strong>
            </h1>

            <div class="ornamento">
                <span></span>
                <b>✦</b>
                <span></span>
            </div>

            <p class="frase">
                "A leitura do mundo precede
                <em>a leitura da palavra"</em> - Paulo Freire
            </p>

        </div>
    </section>

    <section class="login-panel">
        <div class="login-card">

            <div class="cabecalho">
                <span class="subtitulo">BIBLIOTECA EDUCACIONAL BICUDO</span>

                <h2>Bem-vindo(a)!</h2>

                <p>Acesse sua conta para continuar sua jornada de aprendizado.</p>
            </div>

            <form (ngSubmit)="onSubmit()">

                <div class="campo">
                    <label for="email">E-mail</label>
                    <div class="input-container">
                        <input type="email" id="email" name="email" placeholder="seu@email.com"
                            autocomplete="username" [(ngModel)]="email" required>
                    </div>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="input-container">
                        <input [type]="senhaVisivel ? 'text' : 'password'" id="senha" name="senha"
                            placeholder="Digite sua senha" autocomplete="current-password"
                            [(ngModel)]="senha" required>
                        <button type="button" class="mostrar-senha" (click)="alternarSenha()">
                            {{ senhaVisivel ? '◌' : '◉' }}
                        </button>
                    </div>
                </div>

                <button type="submit" class="botao" [disabled]="carregando()">
                    {{ carregando() ? 'Entrando...' : 'Entrar no Sistema' }}
                </button>

                @if (mensagem()) {
                <div class="mensagem">{{ mensagem() }}</div>
                }

                <button type="button" class="esqueci" (click)="esqueciSenha()">
                    Esqueceu sua senha?
                </button>

            </form>

        </div>
    </section>

</main>
